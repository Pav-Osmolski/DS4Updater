name: .NET Release

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download immutable portable test fixture
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DS4Windows-RC4.5.1-x64.zip'
          Invoke-WebRequest 'https://github.com/hbashton/DS4Windows/releases/download/VIIPERRC4.5.1/DS4Windows_VIIPER_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '985B7DA39AB682FAE9ED27EC4B1622F58C240911454CFFC29CD661EC13BBA109') {
            throw 'The immutable RC4.5.1 portable test fixture does not match its pinned SHA-256.'
          }
          "DS4UPDATER_RC451_PACKAGE=$archive" >> $env:GITHUB_ENV

      - name: Download immutable custom-name transaction fixture
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DS4Windows-RC4.6.1-x64.zip'
          Invoke-WebRequest 'https://github.com/hbashton/DS4Windows/releases/download/VIIPERRC4.6.1/DS4Windows_VIIPER_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '0B5B05E491AA01F6EAC58A33B1742FEA62481F7ABDBBC5EBAAE64BE7E7604541') {
            throw 'The immutable RC4.6.1 custom-name transaction fixture does not match its pinned SHA-256.'
          }
          "DS4UPDATER_RC461_PACKAGE=$archive" >> $env:GITHUB_ENV

      - name: Download immutable fork RC4.6.7 fixture
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DS4Windows-RC4.6.7-x64.zip'
          Invoke-WebRequest 'https://github.com/Pav-Osmolski/DS4Windows/releases/download/VIIPERRC4.6.7/DS4Windows_VIIPER_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'F37E860A84F3A08D7FDAD6FD2D1C4D694F0344AEDF8634FDEDF6C350B54A3087') {
            throw 'The immutable fork RC4.6.7 fixture does not match its pinned SHA-256.'
          }
          "DS4UPDATER_RC467_PACKAGE=$archive" >> $env:GITHUB_ENV

      - name: Test release selection and safe portable update
        run: dotnet test .\Updater2.Tests\DS4Updater.Tests.csproj -c Release

      - name: Test immutable release asset verification
        run: pwsh -NoProfile -File .\.github\scripts\Test-ReleaseAssetVerification.ps1

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\Updater2\DS4Updater.csproj

      - name: Build ${{ matrix.platform }}
        run: dotnet publish .\Updater2\DS4Updater.csproj -c Release -r win-${{ matrix.platform }} --self-contained true /p:Platform=${{ matrix.platform }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true -o .\bin\${{ matrix.platform }}\Release\output

      - name: Prepare release asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $output = '.\bin\${{ matrix.platform }}\Release\output'
          $files = @(Get-ChildItem -LiteralPath $output -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DS4Updater.exe') {
            throw 'The portable worker must be published as one self-contained executable.'
          }
          [xml]$project = Get-Content -LiteralPath '.\Updater2\DS4Updater.csproj'
          $expectedVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($expectedVersion.Count -ne 1 -or $files[0].VersionInfo.FileVersion -ne $expectedVersion[0]) {
            throw 'The published updater file version does not match the project.'
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$($expectedVersion[0])") {
            throw 'The release tag does not match the published updater version.'
          }
          $assetName = if ("${{ matrix.platform }}" -eq "x64") { "DS4Updater.exe" } else { "DS4Updater_x86.exe" }
          Copy-Item ".\bin\${{ matrix.platform }}\Release\output\DS4Updater.exe" ".\bin\${{ matrix.platform }}\Release\$assetName"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: .\bin\${{ matrix.platform }}\Release\${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . '.\.github\scripts\ReleaseAssetVerification.ps1'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the build commit.' }
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $tagCommit -or $head -cne $env:GITHUB_SHA) {
            throw 'The release tag, event commit and built source do not match.'
          }
          $path = ".\bin\${{ matrix.platform }}\Release\${{ env.ASSET_NAME }}"
          $file = Get-Item -LiteralPath $path
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'The exact release could not be verified.' }
          if (!(Test-ExistingReleaseAsset -Assets @($release.assets) -ExpectedName $env:ASSET_NAME -ExpectedSize $file.Length -ExpectedSha256 $hash)) {
            gh release upload "$env:RELEASE_TAG" "$path"
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !(Test-ExistingReleaseAsset -Assets @($release.assets) -ExpectedName $env:ASSET_NAME -ExpectedSize $file.Length -ExpectedSha256 $hash)) {
              throw 'The uploaded asset could not be verified.'
            }
          }
          Write-Host "Verified immutable release asset $env:ASSET_NAME ($($file.Length) bytes, SHA-256 $hash)."
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
